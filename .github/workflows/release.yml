name: Build and release TLC

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Create the tag and publish a release (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-15
          - target: windows-amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Linux: everything runs inside Docker (see Dockerfile).
      - name: Build in Docker
        if: runner.os == 'Linux'
        run: |
          docker build --progress=plain --build-arg SOURCE_COMMIT="$GITHUB_SHA" --output out .
          mv out/release out/ci-logs .
      - name: Smoke test FROM scratch image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" --target runtime -t tlc-static .
          # Run as the runner user so TLC can write states/ into the mounted model directory.
          docker run --rm --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,mode=1777 \
            -v "$PWD/tests:/models" tlc-static \
            -Xmx512m -workers 2 -fpmem 0.1 -noGenerateSpecTE Counter.tla | tee ci-logs/scratch.log
      # macOS and Windows: native toolchains (Docker cannot build these).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        if: runner.os != 'Linux'
        with:
          distribution: graalvm-community
          java-version: '25.0.2'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build, compare with JVM, check linkage, package
        if: runner.os != 'Linux'
        run: python ci/build.py --target ${{ matrix.target }}
      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
      - name: Upload build and verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logs-${{ matrix.target }}
          path: ci-logs/
          if-no-files-found: warn

  windows-arm64:
    name: Windows ARM64 (x64 emulation)
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows-amd64
          path: incoming
      - name: Verify x64 TLC on ARM64 Windows and package compatibility build
        shell: pwsh
        run: |
          Expand-Archive incoming/tlc-windows-amd64.zip -DestinationPath arm-package
          python verify.py "$PWD/arm-package/tlc.exe" -Xmx512m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item verification arm-package/verification/windows-arm64 -Recurse
          'This package contains the AMD64 executable, tested on Windows 11 ARM64 using Windows x64 emulation. It is not an ARM64-native executable. No Java installation is required.' | Set-Content arm-package/COMPATIBILITY.txt
          New-Item release -ItemType Directory -Force
          Compress-Archive arm-package/* release/tlc-windows-arm64-emulated.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows-arm64-emulated
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-windows-arm64-emulated
          path: verification/

  release:
    name: Publish GitHub Release
    needs: [build, windows-arm64]
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The tag is the CalVer version that ci/build.py pins and verifies.
      - name: Pick release tag
        id: tag
        run: |
          version=$(cd ci && python3 -c 'import build; print(build.VERSION)')
          echo "rev=$(cd ci && python3 -c 'import build; print(build.REV)')" >> "$GITHUB_OUTPUT"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $tag"
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Check complete release and generate checksums
        working-directory: release
        run: |
          test -f tlc-linux-amd64.tar.gz
          test -f tlc-linux-arm64.tar.gz
          test -f tlc-macos-arm64.tar.gz
          test -f tlc-windows-amd64.zip
          test -f tlc-windows-arm64-emulated.zip
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: release/*
          body: |
            JVM-free TLC ${{ steps.tag.outputs.name }}, built and tested by GitHub Actions from pinned TLA+ source ${{ steps.tag.outputs.rev }}. The version uses the same CalVer scheme as upstream TLC.

            | Platform | AMD64 | ARM64 |
            | --- | --- | --- |
            | Linux | Fully static musl | Fully static musl (Liberica NIK) |
            | macOS | Not provided | Native (Apple Silicon), system libraries |
            | Windows | Native x64, Windows libraries | x64 emulation, tested on Windows 11 ARM64 |

            Windows ARM64 package contains the AMD64 executable; it is explicitly not ARM64-native. macOS and Windows binaries are not fully static. All packages run without a Java installation.

            Each native build passes six JVM/native comparison cases, including safety, liveness, simulation, DFID, and Bakery. Linux packages additionally pass ELF static-link checks and a scratch-container test. Archives include licenses, example models, build metadata, and verification logs. SHA256SUMS covers every archive.
